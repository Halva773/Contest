[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contest-datetime-chunker"
version = "0.1.0"
description = "Split pandas DataFrames without dividing equal timestamps"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
]

[tool.setuptools]
py-modules = ["chunker"]
